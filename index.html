<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#0F1013;--ink2:#4B4F57;--line:#E1E4E8;--red:#E0102B}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;padding:20px}

input:focus{outline:2px solid var(--red);border-color:transparent}
button{width:100%;font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:11px;background:var(--red);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}#err{color:var(--red);font-size:13px;min-height:18px;margin:10px 0 0}
